AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Parameters:
  FunctionName:
    Type: String
  StateMachineName:
    Type: String
Resources:
  Fn:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Ref FunctionName
      Runtime: python3.13
      Handler: index.handler
      InlineCode: |
        def handler(event, context):
            return {"doubled": event["n"] * 2}
  Machine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name: !Ref StateMachineName
      Definition:
        StartAt: Invoke
        States:
          Invoke:
            Type: Task
            Resource: !GetAtt Fn.Arn
            End: true
      Policies:
        - LambdaInvokePolicy:
            FunctionName: !Ref Fn
Outputs:
  StateMachineArn:
    Value: !Ref Machine
  FunctionArn:
    Value: !GetAtt Fn.Arn
