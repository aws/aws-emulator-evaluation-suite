AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Parameters:
  QueueName:
    Type: String
Resources:
  App:
    Type: AWS::Serverless::Application
    Properties:
      Location: child/template.yaml
      Parameters:
        QueueName: !Ref QueueName
Outputs:
  QueueArn:
    Value: !GetAtt App.Outputs.QueueArn
