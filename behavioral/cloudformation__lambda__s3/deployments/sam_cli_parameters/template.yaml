AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Parameters:
  FunctionName:
    Type: String
  Greeting:
    Type: String
  Stage:
    Type: String
    Default: beta
    AllowedValues:
      - beta
      - prod
Resources:
  Fn:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Ref FunctionName
      CodeUri: src/
      Handler: app.handler
      Runtime: python3.13
      Environment:
        Variables:
          GREETING: !Ref Greeting
          STAGE: !Ref Stage
