AWSTemplateFormatVersion: "2010-09-09"
Description: >
  SQS -> Lambda (event source mapping) -> Secrets Manager integration test stack.

Resources:
  Secret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "${AWS::StackName}-secret"
      SecretString: '{"greeting":"hello-from-cfn"}'

  Queue:
    Type: AWS::SQS::Queue

  LambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: access
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                Resource: !GetAtt Queue.Arn
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !Ref Secret

  Function:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt LambdaRole.Arn
      Timeout: 30
      Environment:
        Variables:
          SECRET_ARN: !Ref Secret
      Code:
        ZipFile: |
          import boto3, json, os
          sm = boto3.client("secretsmanager")
          def handler(event, context):
              secret_val = sm.get_secret_value(SecretId=os.environ["SECRET_ARN"])["SecretString"]
              print(json.dumps({"received": len(event.get("Records", [])), "secret": secret_val}))
              return {"ok": True}

  EventSourceMapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn: !GetAtt Queue.Arn
      FunctionName: !Ref Function
      BatchSize: 1

Outputs:
  QueueUrl:
    Value: !Ref Queue
  SecretArn:
    Value: !Ref Secret
  FunctionName:
    Value: !Ref Function
