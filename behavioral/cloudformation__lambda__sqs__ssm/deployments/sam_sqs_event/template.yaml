AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Parameters:
  FunctionName:
    Type: String
  QueueArn:
    Type: String
  MarkerName:
    Type: String
Resources:
  Fn:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Ref FunctionName
      Runtime: python3.13
      Handler: index.handler
      Timeout: 10
      Environment:
        Variables:
          MARKER: !Ref MarkerName
      Policies:
        - Statement:
            - Effect: Allow
              Action: ssm:PutParameter
              Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${MarkerName}
      InlineCode: |
        import os

        import boto3


        def handler(event, context):
            body = event["Records"][0]["body"]
            boto3.client("ssm").put_parameter(
                Name=os.environ["MARKER"], Value=body, Type="String", Overwrite=True)
      Events:
        Work:
          Type: SQS
          Properties:
            Queue: !Ref QueueArn
            BatchSize: 1
