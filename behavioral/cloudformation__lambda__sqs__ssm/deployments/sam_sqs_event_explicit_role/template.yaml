AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Parameters:
  FunctionName:
    Type: String
  QueueArn:
    Type: String
  MarkerName:
    Type: String
  GrantQueueAccess:
    Type: String
    AllowedValues: ["true", "false"]
Conditions:
  Grant: !Equals [!Ref GrantQueueAccess, "true"]
Resources:
  Role:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: marker
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ssm:PutParameter
                Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${MarkerName}
        - !If
          - Grant
          - PolicyName: poll
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Effect: Allow
                  Action:
                    - sqs:ReceiveMessage
                    - sqs:DeleteMessage
                    - sqs:GetQueueAttributes
                  Resource: !Ref QueueArn
          - !Ref AWS::NoValue
  Fn:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Ref FunctionName
      Runtime: python3.13
      Handler: index.handler
      Timeout: 10
      Role: !GetAtt Role.Arn
      Environment:
        Variables:
          MARKER: !Ref MarkerName
      InlineCode: |
        import os

        import boto3


        def handler(event, context):
            body = event["Records"][0]["body"]
            boto3.client("ssm").put_parameter(
                Name=os.environ["MARKER"], Value=body, Type="String", Overwrite=True)
      Events:
        Work:
          Type: SQS
          Properties:
            Queue: !Ref QueueArn
            BatchSize: 1
